<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Meus Gastos</title>
<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--fill:rgba(118,118,128,.12);--segon:#ffffff;
  --text:#000000;--muted:rgba(60,60,67,.6);--sep:rgba(60,60,67,.2);--gray:#8e8e93;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;
  --bar:rgba(249,249,249,.84);--tint:rgba(0,122,255,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--segon:#636366;--text:#ffffff;--muted:rgba(235,235,245,.6);--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--bar:rgba(30,30,30,.84);--tint:rgba(10,132,255,.2);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--segon:#636366;--text:#ffffff;--muted:rgba(235,235,245,.6);--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--bar:rgba(30,30,30,.84);--tint:rgba(10,132,255,.2);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
main{max-width:520px;margin:0 auto;padding:10px 16px 120px}
section{display:none}section.on{display:block}
[hidden]{display:none!important}
b{font-weight:600}
h1{font-size:34px;line-height:1.1;letter-spacing:.37px;font-weight:700;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
.gw{position:relative;flex:none}
.gear{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--blue);display:grid;place-items:center;padding:0;cursor:pointer}
.gear svg{width:24px;height:24px}
.pop{position:absolute;right:0;top:44px;min-width:220px;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.22);z-index:20;overflow:hidden}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;cursor:pointer;border-bottom:.5px solid var(--sep)}
.pop button:last-child{border-bottom:0}
.pop button:active{background:var(--fill)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.muted{color:var(--muted);font-size:15px}
.mes{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.mes button{width:44px;height:44px;border:0;background:transparent;color:var(--blue);font-size:32px;font-weight:300;line-height:1;cursor:pointer}
.mes b{text-transform:capitalize}
.total .v{font-size:44px;font-weight:700;letter-spacing:.3px;margin:2px 0 4px}
.sobra{margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);font-size:15px;color:var(--muted)}
.sobra b{color:var(--green);float:right;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tiles div{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tiles span{font-size:13px;font-weight:600}
.tiles div:nth-child(1) span{color:var(--orange)}
.tiles div:nth-child(2) span{color:var(--blue)}
.tiles div:nth-child(3) span{color:var(--purple)}
.tiles b{font-size:17px;letter-spacing:-.2px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:30px;background:var(--card);border-radius:50%}
.legend{flex:1;display:flex;flex-direction:column;gap:8px;font-size:15px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative;min-height:58px}
.item::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep)}
.item:last-child::after,.plano .item::after{display:none}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .muted{display:block;font-size:13px}
.val{font-weight:600;white-space:nowrap;letter-spacing:-.2px;text-align:right}
.val small{display:block;font-weight:400;font-size:12px}
.tag{font-style:normal;font-size:11px;font-weight:600;color:var(--blue);background:var(--tint);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.acts{display:flex;gap:2px;flex:none}
.acts button{border:0;background:transparent;color:var(--blue);padding:8px;border-radius:8px;font-size:15px;cursor:pointer;display:grid;place-items:center}
.acts button svg{width:19px;height:19px}
.acts .del{color:var(--red)}
.plano{border-top:.5px solid var(--sep);padding:12px 0}
.plano.off{opacity:.55}
.pa{margin-top:8px;padding-left:52px;gap:8px;flex-wrap:wrap}
.pa button{background:var(--fill);padding:6px 12px;border-radius:999px;font-size:14px}
.pform{padding:0 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px 4px}
input[type=text],input[type=date],input[type=number]:not(.valor),select{display:block;width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:0;background:var(--fill);color:var(--text);font-size:17px;outline:none}
input[type=text],input[type=number]{-webkit-appearance:none;appearance:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--blue)}
.card select{margin-bottom:6px}
.valor{display:block;width:100%;border:0;background:transparent;font-size:48px;font-weight:700;letter-spacing:.3px;text-align:center;outline:none;padding:4px 0;-webkit-appearance:none;appearance:none}
.valor::placeholder{color:var(--muted);opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--fill);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:10px 0;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.sw span{display:flex;flex-direction:column}
.sw small{font-size:13px}
.sw input{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;cursor:pointer;flex:none;transition:background .25s;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16),0 3px 1px rgba(0,0,0,.1);transition:left .25s}
.sw input:checked{background:var(--green)}
.sw input:checked::after{left:22px}
.prev{margin-top:14px;padding:12px 14px;background:var(--fill);border-radius:12px;font-size:15px;color:var(--muted)}
.prev b{color:var(--text)}
.btn{width:100%;margin-top:22px;min-height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}
.btn.sec{background:var(--tint);color:var(--blue);margin-top:10px}
.mini{border:0;background:var(--tint);color:var(--blue);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;cursor:pointer;flex:none}
.empty{text-align:center;padding:26px 8px;color:var(--muted);font-size:15px}
.empty .btn{width:auto;padding:0 22px;margin-top:14px;min-height:44px}
.mrow{display:grid;grid-template-columns:62px 1fr 100px;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:10px 4px;font-size:15px;cursor:pointer;text-align:left;border-radius:8px}
.mrow.on{background:var(--fill)}
.mrow i{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.mrow u{display:block;height:100%;background:var(--blue);border-radius:99px;text-decoration:none}
.mrow b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.stack{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--fill);margin-bottom:8px}
.stack i{display:block;height:100%}
.rl{display:flex;justify-content:space-between;align-items:center;padding:11px 0;position:relative}
.rl+.rl::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep)}
.rl span{display:flex;align-items:center;gap:10px}
.rl i{width:10px;height:10px;border-radius:50%;flex:none}
.neg{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:.5px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--gray);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
nav button.on{color:var(--blue)}
.ti{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(58,58,60,.92);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:30;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

html{touch-action:manipulation;overscroll-behavior-y:none}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.acts button{min-width:40px;min-height:40px}
.item .acts{gap:0}
.item .acts button{min-width:34px;padding:8px 5px}
.chip{min-height:40px}
.seg button{min-height:36px}
.pa button{min-height:38px}
.mini{min-height:36px}
.mes button{width:48px;height:48px}
body.kb nav{display:none}
body.kb main{padding-bottom:28px}
.wf{padding:10px 0;position:relative}
.wf+.wf::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep)}
.wl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wl b{font-variant-numeric:tabular-nums}
.wt{position:relative;height:8px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:8px}
.wt u{position:absolute;top:0;bottom:0;border-radius:99px;text-decoration:none;min-width:3px}
.wt s{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5;z-index:1;text-decoration:none}
.wsub{font-size:13px;margin-top:4px;text-align:right}
.fim .wl{font-size:19px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.alerta{color:var(--orange)!important;font-weight:600}
</style>
</head>
<body>
<main>
  <section id="s-inicio" class="on"></section>
  <section id="s-fixos"></section>
  <section id="s-add"></section>
  <section id="s-parc"></section>
  <section id="s-comp"></section>
  <section id="s-perfil"></section>
  <section id="s-rec"></section>
</main>
<nav><div>
  <button data-aba="inicio" class="on"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>Início</button>
  <button data-aba="fixos"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Fixos</button>
  <button data-aba="add"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>Adicionar</button>
  <button data-aba="parc"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Parcelas</button>
  <button data-aba="comp"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M17.5 14.2c2.4.2 4 1.9 4 4.3"/></svg>Compartilhado</button>
</div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="imp-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
const IC={more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="7.8" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="16.2" cy="12" r="1" fill="currentColor"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'};

const CATS=[
 {n:"Alimentação",e:"🍽️",c:"#FF9500"},{n:"Transporte",e:"🚌",c:"#007AFF"},
 {n:"Moradia",e:"🏠",c:"#AF52DE"},{n:"Lazer",e:"🎬",c:"#FF2D55"},
 {n:"Saúde",e:"💊",c:"#FF3B30"},{n:"Educação",e:"📚",c:"#30B0C7"},{n:"Outros",e:"🧩",c:"#8E8E93"}
];
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $=id=>document.getElementById(id);
const cat=n=>CATS.find(c=>c.n===n)||CATS[6];
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mIdx=m=>{const[y,n]=m.split("-").map(Number);return y*12+n-1};
const mStr=i=>Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0");
const mLabel=m=>{const[y,n]=m.split("-");return MS[n-1]+"/"+y};
const dataBR=d=>d.split("-").reverse().slice(0,2).join("/");

let mem=null;
function load(){
  try{
    const d=JSON.parse(localStorage.getItem("cg2"));
    if(d&&d.gastos)return d;
    const o=JSON.parse(localStorage.getItem("gastos"));
    if(Array.isArray(o))return{gastos:o,planos:[]};
  }catch(e){}
  return mem||{gastos:[],planos:[]};
}
function save(){mem={gastos:S.gastos,planos:S.planos,receb:S.receb,perfil:S.perfil,pct:S.pct,avisos:S.avisos};try{localStorage.setItem("cg2",JSON.stringify(mem))}catch(e){}gravaAgenda()}

const D=load();
const S={gastos:D.gastos,planos:D.planos||[],receb:D.receb||[],perfil:D.perfil||{},pct:D.pct||0,avisos:D.avisos||false,mes:hoje().slice(0,7),aba:"inicio",edit:null,pf:null,pesc:"comp",rf:null,ptipo:"mensal",rtipo:"mensal",tipoAdd:"mensal",menu:false,del:null,filtro:"Todas",cat:"Alimentação"};
S.planos.forEach(p=>{if(p.comp===undefined)p.comp=p.pessoas>1});

/* ---- parcelamentos e contas (planos) ---- */
const bruta=p=>p.tipo==="parcelado"?p.valor/p.parcelas:p.valor;
const minha=p=>bruta(p)/p.pessoas;
function ocorre(p,m){const i=mIdx(m)-mIdx(p.inicio.slice(0,7));if(i<0||(p.tipo==="parcelado"&&i>=p.parcelas)||(p.fim&&m>p.fim))return null;return i}
function ultimo(p){let f=p.tipo==="parcelado"?mStr(mIdx(p.inicio.slice(0,7))+p.parcelas-1):null;if(p.fim&&(!f||p.fim<f))f=p.fim;return f}
function itens(m){
  const a=S.gastos.filter(g=>g.data.startsWith(m)).map(g=>({...g,k:"g",tp:"avulso"}));
  const[y,n]=m.split("-").map(Number),dim=new Date(y,n,0).getDate();
  S.planos.forEach(p=>{const i=ocorre(p,m);if(i===null)return;
    a.push({id:p.id,k:"p",tp:p.tipo,valor:minha(p),data:m+"-"+String(Math.min(+p.inicio.slice(8),dim)).padStart(2,"0"),categoria:p.categoria,descricao:p.descricao,tag:p.tipo==="parcelado"?(i+1)+"/"+p.parcelas:"Fixo",pessoas:p.pessoas})});
  return a.sort((x,z)=>z.data.localeCompare(x.data)||(x.descricao||"").localeCompare(z.descricao||""));
}

/* ---- recebimentos e resumo do mês ---- */
function recOc(r,m){const i=mIdx(m)-mIdx(r.inicio.slice(0,7));return r.tipo==="mensal"?(i>=0&&!(r.fim&&m>r.fim)):i===0}
function recebido(m){let t=0,b=0;S.receb.forEach(r=>{if(recOc(r,m)){t+=r.valor;if(r.g)b+=r.valor}});return[t,b]}
function resumo(m){
  const it=itens(m),so=f=>it.filter(f).reduce((s,x)=>s+x.valor,0);
  const fixos=so(x=>x.tp==="mensal"),parc=so(x=>x.tp==="parcelado"),avul=so(x=>x.tp==="avulso");
  const[rec,base]=recebido(m),guard=base*S.pct/100,total=fixos+parc+avul;
  return{it,fixos,parc,avul,total,rec,guard,sobra:rec-guard-total};
}
function acumulado(){
  let ini=null;S.receb.forEach(r=>{const i=mIdx(r.inicio.slice(0,7));if(ini===null||i<ini)ini=i});
  if(ini===null)return 0;let t=0;
  for(let i=ini;i<=mIdx(hoje().slice(0,7));i++)t+=recebido(mStr(i))[1]*S.pct/100;
  return t;
}

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function mudaMes(d){S.mes=mStr(mIdx(S.mes)+d);render()}
const nomeMes=()=>{const[y,m]=S.mes.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
const mesBar=()=>`<div class="mes"><button data-m="-1">‹</button><b>${nomeMes()}</b><button data-m="1">›</button></div>`;

  const lista=Object.entries(por).sort((a,b)=>b[1]-a[1]);
  let acc=0;const stops=lista.map(([n,v])=>{const a=acc/total*100;acc+=v;return `${cat(n).c} ${a}% ${acc/total*100}%`}).join(",");
  const vis=all.filter(x=>S.filtro==="Todas"||x.categoria===S.filtro);

  }else{
    h+=`<div class="card"><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"></div>
    <div class="legend">${lista.map(([n,v])=>`<div><i style="background:${cat(n).c}"></i><span>${n}</span><b>${Math.round(v/total*100)}%</b></div>`).join("")}</div></div></div>

function salvarGasto(){
  const valor=parseFloat($("f-valor").value),data=$("f-data").value,descricao=$("f-desc").value.trim();
  const t=S.edit?"avulso":S.tipoAdd,n=$("f-n")?parseInt($("f-n").value):0;
  if(!(valor>0))return toast("Informe um valor");
  if(!data)return toast("Escolha a data");
  if(t==="parcelado"&&!(n>=2&&n<=60))return toast("Parcelas: de 2 a 60");
  if(S.edit)Object.assign(S.gastos.find(x=>x.id===S.edit),{valor,data,descricao,categoria:S.cat});
  else if(t==="avulso")S.gastos.push({id:uid(),valor,data,descricao,categoria:S.cat});
  else S.planos.push({id:uid(),descricao:descricao||S.cat,categoria:S.cat,valor,tipo:t,parcelas:t==="parcelado"?n:null,pessoas:1,comp:false,inicio:data});
  const msg=S.edit?"Gasto atualizado":t==="mensal"?"Gasto fixo salvo":t==="parcelado"?"Parcelado em "+n+"×":"Gasto salvo";
  S.edit=null;S.mes=data.slice(0,7);save();toast(msg);ir("inicio");
}

function meses(sc){
  const L=sc?S.planos.filter(p=>escDe(p)===sc):S.planos;
  if(sc?!L.length:(!S.gastos.length&&!S.planos.length))return '<div class="empty">Sem lançamentos ainda.</div>';
  const cur=mIdx(hoje().slice(0,7));let ini=cur;
  if(!sc)S.gastos.forEach(g=>ini=Math.min(ini,mIdx(g.data.slice(0,7))));
  L.forEach(p=>ini=Math.min(ini,mIdx(p.inicio.slice(0,7))));
  ini=Math.max(ini,cur-5);
  let fim=cur+11;L.forEach(p=>{const u=ultimo(p);if(u)fim=Math.max(fim,Math.min(mIdx(u),cur+47))});
  const rows=[];for(let i=ini;i<=fim;i++){const m=mStr(i);rows.push([m,sc?L.reduce((t,p)=>ocorre(p,m)!==null?t+minha(p):t,0):itens(m).reduce((t,x)=>t+x.valor,0)])}
  const mx=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(([m,t])=>`<button class="mrow ${m===S.mes?"on":""}" ${sc?"data-mesel":"data-go"}="${m}"><span>${mLabel(m)}${mIdx(m)===cur?" •":""}</span><i><u style="width:${t/mx*100}%"></u></i><b>${brl(t)}</b></button>`).join("");
}
function renderPlanos(sc,titulo,sub,vazio){

  const tot=L.filter(p=>ocorre(p,S.mes)!==null).reduce((t,p)=>t+minha(p),0);
  const nome={fixos:"gastos fixos",parc:"parcelas",comp:"contas compartilhadas (só a sua parte)"}[sc];
  return head(titulo)+mesBar()+`<div class="card"><div class="row"><b>${sub}</b>${abre?"":`<button class="mini" data-novo="${sc}">＋ Nova</button>`}</div>

/* ---- Recebimentos e guardar dinheiro ---- */
function resHTML(){
  const R=resumo(S.mes);
  if(!R.rec)return '<div class="empty">Nenhum recebimento neste mês. Cadastre abaixo seu salário ou outras entradas.</div>';
  const lo=Math.min(0,R.sobra),sp=(R.rec-lo)||1,pc=x=>(x-lo)/sp*100;
  const barra=(a,b,c)=>`<div class="wt">${lo<0?`<s style="left:${pc(0)}%"></s>`:""}<u style="left:${pc(Math.min(a,b))}%;width:${Math.abs(pc(a)-pc(b))}%;background:${c}"></u></div>`;
  const linha=(t,v,a,b,c,sinal,sub,cls)=>`<div class="wf ${cls||""}"><div class="wl"><span>${t}</span><b>${sinal}${brl(Math.abs(v))}</b></div>${barra(a,b,c)}${sub?`<div class="muted wsub">${sub}</div>`:""}</div>`;
  let saldo=R.rec,h=linha("Recebido",R.rec,0,R.rec,"#30B0C7","");
  [["Guardado ("+S.pct+"%)",R.guard,"#AF52DE"],["Contas fixas",R.fixos,"#FF9500"],["Parcelas e avulsos",R.parc+R.avul,"#007AFF"]].forEach(([t,v,c])=>{
    if(!v)return;const apos=saldo-v;
    h+=linha(t,v,saldo,apos,c,"− ",apos<0?"faltam "+brl(-apos):"restam "+brl(apos));saldo=apos;
  });
  return h+linha(R.sobra<0?"Faltou":"Sobrou para mim",R.sobra,0,R.sobra,R.sobra<0?"#FF3B30":"#34C759",R.sobra<0?"− ":"","","fim");
}

const TIPO={mensal:"Fixo",parcelado:"Parcela",avulso:"Avulso"};
const dt=x=>new Date((x.length===7?x+"-01":x)+"T00:00:00Z");
function carregaLib(){return window.ExcelJS?Promise.resolve():new Promise((ok,erro)=>{const e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";e.onload=ok;e.onerror=erro;document.head.appendChild(e)})}
function rangeMeses(){
  const cur=mIdx(hoje().slice(0,7));let ini=cur,fim=cur+11;
  S.gastos.forEach(g=>ini=Math.min(ini,mIdx(g.data.slice(0,7))));
  S.receb.forEach(r=>ini=Math.min(ini,mIdx(r.inicio.slice(0,7))));
  S.planos.forEach(p=>{ini=Math.min(ini,mIdx(p.inicio.slice(0,7)));const u=ultimo(p);if(u)fim=Math.max(fim,Math.min(mIdx(u),cur+47))});
  const out=[];for(let i=Math.max(ini,fim-59);i<=fim;i++)out.push(mStr(i));return out;

/* ---- vencimentos e avisos ---- */
function proximos(n){
  const t=dt(hoje()),m0=hoje().slice(0,7),m1=mStr(mIdx(m0)+1);
  return[...itens(m0),...itens(m1)].map(x=>({...x,dd:Math.round((dt(x.data)-t)/864e5)})).filter(x=>x.dd>=0&&x.dd<=n)
    .sort((a,b)=>a.dd-b.dd||(a.descricao||"").localeCompare(b.descricao||""));
}
function vencHTML(){
  const L=proximos(7);if(!L.length)return"";
  const q=n=>n===0?"Hoje":n===1?"Amanhã":"em "+n+" dias";
  return `<div class="card"><div class="row"><b>Vencimentos próximos</b></div>${L.slice(0,6).map(x=>{const c=cat(x.categoria);
    return `<div class="item"><div class="ico" style="background:${c.c}22">${c.e}</div><div class="info"><b>${esc(x.descricao||x.categoria)}</b><span class="muted ${x.dd<=2?"alerta":""}">${dataBR(x.data)} · ${q(x.dd)}</span></div><div class="val">${brl(x.valor)}</div></div>`}).join("")}</div>`;
}

const cv=v=>v&&typeof v==="object"&&!(v instanceof Date)?(v.result!==undefined?v.result:(v.text||"")):v;
const isoD=v=>{v=cv(v);return v instanceof Date?v.toISOString().slice(0,10):(typeof v==="string"&&/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):"")};

async function lerPlanilha(f){
  if(!f)return;toast("Lendo planilha…");
  try{await carregaLib()}catch(e){return toast("Sem internet para ler a planilha")}
  try{
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
    const wC=wb.getWorksheet("Contas e parcelas"),wR=wb.getWorksheet("Recebimentos"),wL=wb.getWorksheet("Lançamentos");
    if(!wC||!wR||!wL)return toast("Esta não parece ser a planilha exportada pelo app");
    const planos=[],receb=[],gastos=[];let pct=null,nome=null;
    wC.eachRow((r,n)=>{if(n<2)return;const g=k=>r.getCell(k).value,desc=txtC(g(1)),ini=isoD(g(10));if(!desc||!ini)return;
      const par=txtC(g(4))==="Parcelado",o={id:uid(),descricao:desc,categoria:txtC(g(2))||"Outros",valor:numC(g(5)),tipo:par?"parcelado":"mensal",parcelas:par?Math.max(1,Math.round(numC(g(6)))):null,pessoas:Math.max(1,Math.round(numC(g(7)))||1),comp:txtC(g(3))==="Compartilhado",inicio:ini};
      const k=isoD(g(11));if(k){const km=k.slice(0,7);if(!par||km!==mStr(mIdx(ini.slice(0,7))+o.parcelas-1))o.fim=km}
      planos.push(o)});
    wR.eachRow((r,n)=>{if(n<2)return;const g=k=>r.getCell(k).value,desc=txtC(g(1)),ini=isoD(g(4));if(!desc||!ini)return;
      const f6=numC(g(6)),k=isoD(g(5)),o={id:uid(),descricao:desc,tipo:txtC(g(2))==="Todo mês"?"mensal":"unico",valor:numC(g(3)),inicio:ini,g:f6>0};
      if(k&&o.tipo==="mensal")o.fim=k.slice(0,7);if(f6>0)pct=Math.round(f6*1000)/10;receb.push(o)});
    wL.eachRow((r,n)=>{if(n<2)return;const g=k=>r.getCell(k).value;if(txtC(g(5))!=="Avulso")return;const data=isoD(g(2));if(!data)return;
      const c=txtC(g(4))||"Outros",ds=txtC(g(3));gastos.push({id:uid(),data,descricao:ds===c?"":ds,valor:numC(g(8)),categoria:c})});
    const wK=wb.getWorksheet("Configurações");
    if(wK)wK.eachRow((r,n)=>{if(n<2)return;const k=txtC(r.getCell(1).value);if(k==="Nome")nome=txtC(r.getCell(2).value);if(k==="Percentual guardado")pct=numC(r.getCell(2).value)});

  }catch(e){toast("Não consegui ler esta planilha")}
}

const campo=el=>el&&((el.tagName==="INPUT"&&/^(text|number)$/.test(el.type))||el.tagName==="TEXTAREA");
document.addEventListener("focusin",e=>{if(campo(e.target))document.body.classList.add("kb")});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!campo(document.activeElement))document.body.classList.remove("kb")},60));
document.addEventListener("click",e=>{if(campo(document.activeElement)&&!campo(e.target))document.activeElement.blur()});
checaAvisos();setInterval(checaAvisos,18e5);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checaAvisos()});
render();

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
